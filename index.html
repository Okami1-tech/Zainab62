<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nikkah — In Shaa Allah</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020003;
}

body {
    position: relative;
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================================================
   DEEP PURPLE ATMOSPHERE
========================================================= */

body::before {
    content: "";
    position: fixed;
    width: 90vmin;
    height: 90vmin;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(138,43,226,.14) 0%,
            rgba(91,25,150,.07) 30%,
            transparent 70%
        );

    filter: blur(35px);
    pointer-events: none;
}

/* subtle moving purple light */

body::after {
    content: "";
    position: fixed;
    width: 45vmin;
    height: 45vmin;
    left: 20%;
    top: 20%;

    background: rgba(150,60,255,.035);
    border-radius: 50%;
    filter: blur(80px);

    animation: atmosphere 8s ease-in-out infinite alternate;
}

@keyframes atmosphere {
    from {
        transform: translate(0,0);
    }

    to {
        transform: translate(35vw,25vh);
    }
}


/* =========================================================
   HEART CONTAINER
========================================================= */

#heart {
    position: absolute;

    width: min(98vw, 1000px);
    height: min(92vh, 900px);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.98);

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}


/* =========================================================
   ROWS
========================================================= */

.row {

    height: clamp(10px, 1.45vh, 15px);

    display: flex;
    align-items: center;
    justify-content: center;

    white-space: nowrap;

    opacity: 0;

    transform:
        translateY(100px)
        scale(.55);

    animation:
        buildHeart
        3.4s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay: var(--delay);
}


/* =========================================================
   EVERY NIKKAH
========================================================= */

.word {

    display: inline-block;

    margin:
        0 clamp(1px, .15vw, 2px);

    color: #b95cff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(6px, .85vw, 10px);

    font-weight: bold;

    letter-spacing: .025em;

    text-shadow:
        0 0 3px rgba(138,43,226,.9),
        0 0 8px rgba(138,43,226,.75),
        0 0 16px rgba(138,43,226,.45);

    opacity:
        calc(.55 + var(--brightness));

    animation:
        wordGlow
        3.5s
        ease-in-out
        infinite alternate;
}


/* Different purple tones */

.word:nth-child(4n) {
    color: #c875ff;
}

.word:nth-child(7n) {
    color: #9f3fff;
}

.word:nth-child(11n) {
    color: #dc9cff;
}


/* =========================================================
   HEART FORMATION
========================================================= */

@keyframes buildHeart {

    0% {
        opacity: 0;

        transform:
            translateY(100px)
            scale(.45);
    }

    35% {
        opacity: .25;
    }

    75% {
        opacity: .85;
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes wordGlow {

    from {
        filter: brightness(.75);
    }

    to {
        filter: brightness(1.2);
    }
}


/* =========================================================
   CENTER NIKKAH
========================================================= */

#center {

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;

    z-index: 50;

    pointer-events: none;

    animation:
        revealCenter
        2.5s
        cubic-bezier(.16,1,.3,1)
        6.3s
        forwards;
}


#centerWord {

    color: #e4b9ff;

    font-size:
        clamp(40px, 11vw, 100px);

    font-weight: bold;

    letter-spacing: .09em;

    text-align: center;

    text-shadow:

        0 0 5px #8a2be2,

        0 0 15px #8a2be2,

        0 0 30px #8a2be2,

        0 0 55px #8a2be2,

        0 0 100px rgba(138,43,226,.75);

    animation:
        centerPulse
        3s
        ease-in-out
        infinite;
}


@keyframes revealCenter {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2);
    }

    65% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

    100% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


@keyframes centerPulse {

    0%,
    100% {

        filter:
            brightness(.9);

        text-shadow:

            0 0 5px #8a2be2,

            0 0 15px #8a2be2,

            0 0 35px #8a2be2,

            0 0 70px rgba(138,43,226,.65);
    }

    50% {

        filter:
            brightness(1.3);

        text-shadow:

            0 0 7px #a94fff,

            0 0 20px #8a2be2,

            0 0 45px #8a2be2,

            0 0 100px rgba(138,43,226,.9);
    }
}


/* =========================================================
   IN SHAA ALLAH
========================================================= */

#subtitle {

    position: fixed;

    left: 50%;
    top: calc(50% + clamp(48px, 8vw, 80px));

    transform:
        translateX(-50%)
        translateY(15px);

    opacity: 0;

    z-index: 50;

    color: rgba(225,190,255,.9);

    font-size:
        clamp(12px, 3vw, 19px);

    letter-spacing:
        .28em;

    white-space: nowrap;

    text-shadow:
        0 0 8px rgba(138,43,226,.8),
        0 0 20px rgba(138,43,226,.45);

    animation:
        subtitleReveal
        2s
        ease
        7.5s
        forwards;
}


@keyframes subtitleReveal {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(15px);

    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);

    }
}


/* =========================================================
   BOTTOM MESSAGE
========================================================= */

#bottom {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%);

    color:
        rgba(201,154,255,.35);

    font-size: 9px;

    letter-spacing:
        .32em;

    text-transform:
        uppercase;

    white-space: nowrap;

    opacity: 0;

    animation:
        bottomReveal
        2s
        ease
        9s
        forwards;
}


@keyframes bottomReveal {

    to {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #heart {

        width: 112vw;

        height: 88vh;
    }

    .row {

        height: 10px;
    }

    .word {

        font-size: 6px;

        margin:
            0 .8px;
    }

    #centerWord {

        font-size:
            clamp(36px, 14vw, 65px);
    }

    #subtitle {

        top:
            calc(50% + 48px);

        font-size: 11px;

        letter-spacing: .24em;
    }
}
</style>
</head>

<body>


<!-- =====================================================
     THE ENTIRE HEART IS MADE FROM TEXT
====================================================== -->

<div id="heart"></div>


<!-- =====================================================
     FINAL REVEAL
====================================================== -->

<div id="center">

    <div id="centerWord">
        NIKKAH
    </div>

</div>


<div id="subtitle">
    In Shaa Allah
</div>


<div id="bottom">
    A beautiful beginning
</div>


<script>

/* =========================================================
   NIKKAH TEXT HEART ENGINE
========================================================= */

const heart =
    document.getElementById("heart");


/*
=============================================================
THE HEART SILHOUETTE
=============================================================

Each number = number of NIKKAH words on that row.

The first rows contain TWO separate groups.

That empty center creates the indentation.

Then the two lobes merge.

Then the heart gradually becomes narrower.

Finally:

NIKKAH

NIKKAH

NIKKAH

NIKKAH

NIKKAH

NIKKAH

        NIKKAH

                 NIKKAH

                      NIKKAH

                           NIKKAH

                                NIKKAH

                                     NIKKAH

                                          NIKKAH

                                               NIKKAH

                                                    NIKKAH

                                                         NIKKAH

                                                              NIKKAH

                                                                   NIKKAH

                                                                        NIKKAH

=============================================================================
*/


const rows = [

    /* =====================================================
       TWO LARGE ROUNDED LOBES
    ===================================================== */

    { count: 34, gap: 22 },
    { count: 46, gap: 20 },
    { count: 58, gap: 18 },
    { count: 68, gap: 17 },
    { count: 76, gap: 15 },
    { count: 82, gap: 13 },

    /* =====================================================
       LOBES START JOINING
    ===================================================== */

    { count: 88, gap: 10 },
    { count: 92, gap: 7 },
    { count: 96, gap: 4 },

    /* =====================================================
       FULL HEART WIDTH
    ===================================================== */

    { count: 100, gap: 0 },
    { count: 102, gap: 0 },
    { count: 103, gap: 0 },
    { count: 104, gap: 0 },
    { count: 104, gap: 0 },

    /* =====================================================
       START NARROWING
    ===================================================== */

    { count: 103, gap: 0 },
    { count: 101, gap: 0 },
    { count: 98, gap: 0 },
    { count: 95, gap: 0 },
    { count: 92, gap: 0 },
    { count: 88, gap: 0 },
    { count: 84, gap: 0 },
    { count: 80, gap: 0 },
    { count: 76, gap: 0 },
    { count: 72, gap: 0 },
    { count: 68, gap: 0 },
    { count: 64, gap: 0 },
    { count: 60, gap: 0 },
    { count: 56, gap: 0 },
    { count: 52, gap: 0 },
    { count: 48, gap: 0 },
    { count: 44, gap: 0 },
    { count: 40, gap: 0 },
    { count: 36, gap: 0 },
    { count: 32, gap: 0 },
    { count: 28, gap: 0 },
    { count: 24, gap: 0 },
    { count: 20, gap: 0 },
    { count: 17, gap: 0 },
    { count: 14, gap: 0 },
    { count: 11, gap: 0 },
    { count: 8, gap: 0 },
    { count: 6, gap: 0 },
    { count: 4, gap: 0 },
    { count: 3, gap: 0 },
    { count: 2, gap: 0 },
    { count: 1, gap: 0 }
];


/* =========================================================
   BUILD EACH ROW
========================================================= */

rows.forEach((data, rowIndex) => {

    const row =
        document.createElement("div");

    row.className = "row";


    /*
    Slower formation.

    The heart builds from top to bottom,
    rather than appearing immediately.
    */

    row.style.setProperty(
        "--delay",
        `${rowIndex * 0.085}s`
    );


    /*
    =========================================================
    TWO LOBES
    =========================================================
    */

    if (data.gap > 0) {

        const total =
            data.count;

        const eachSide =
            Math.floor(total / 2);


        /*
        LEFT LOBE
        */

        for (
            let i = 0;
            i < eachSide;
            i++
        ) {

            row.appendChild(
                createNikkah()
            );
        }


        /*
        CENTER VALLEY

        This is real empty space.
        No image.
        No SVG.
        No shape underneath.

        The words themselves define the heart.
        */

        const valley =
            document.createElement("span");

        valley.style.display =
            "inline-block";

        valley.style.width =
            `${data.gap}px`;

        row.appendChild(valley);


        /*
        RIGHT LOBE
        */

        for (
            let i = 0;
            i < eachSide;
            i++
        ) {

            row.appendChild(
                createNikkah()
            );
        }

    } else {

        /*
        FULL ROW
        */

        for (
            let i = 0;
            i < data.count;
            i++
        ) {

            row.appendChild(
                createNikkah()
            );
        }
    }


    heart.appendChild(row);
});


/* =========================================================
   CREATE NIKKAH WORD
========================================================= */

function createNikkah() {

    const word =
        document.createElement("span");

    word.className =
        "word";

    word.textContent =
        "NIKKAH";


    /*
    Random brightness gives the huge heart
    a subtle living texture.
    */

    word.style.setProperty(
        "--brightness",
        (Math.random() * .4).toFixed(2)
    );


    return word;
}


/* =========================================================
   RESTART
========================================================= */

document.body.addEventListener(
    "click",
    () => {

        const allRows =
            document.querySelectorAll(".row");


        allRows.forEach(
            (row, index) => {

                row.style.animation =
                    "none";

                void row.offsetWidth;

                row.style.animation =
                    `buildHeart
                     3.4s
                     cubic-bezier(.16,1,.3,1)
                     ${index * .085}s
                     forwards`;
            }
        );


        /*
        Reset final reveal.
        */

        const center =
            document.getElementById("center");

        const subtitle =
            document.getElementById("subtitle");


        center.style.animation =
            "none";

        subtitle.style.animation =
            "none";


        void center.offsetWidth;


        center.style.animation =
            "revealCenter 2.5s cubic-bezier(.16,1,.3,1) 6.3s forwards";

        subtitle.style.animation =
            "subtitleReveal 2s ease 7.5s forwards";
    }
);

</script>

</body>
</html>
