<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Sarauniya 💜</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030005;
    font-family:Georgia, "Times New Roman", serif;
    color:white;
}

body{
    position:relative;
}

/* =========================
   STAR FIELD
========================= */

#space{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
      radial-gradient(circle at center,#160020 0%,#07000b 45%,#020003 100%);
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    box-shadow:0 0 7px rgba(255,255,255,.8);
}

/* Cinematic forward stars */
.star.fly{
    animation:flyIn var(--speed) cubic-bezier(.2,.7,.2,1) forwards;
}

@keyframes flyIn{
    0%{
        transform:translate3d(0,0,0) scale(.2);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
          translate3d(
            calc((var(--x) - 50) * 9vw),
            calc((var(--y) - 50) * 9vh),
            800px
          )
          scale(7);
        opacity:0;
    }
}

/* =========================
   ONE STAR
========================= */

#singleStar{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(0);
    width:18px;
    height:18px;
    opacity:0;
    z-index:5;
}

#singleStar.show{
    animation:starAppear 2.5s ease forwards;
}

.starCore{
    width:100%;
    height:100%;
    transform:rotate(45deg);
    background:white;
    box-shadow:
      0 0 10px white,
      0 0 30px #c77dff,
      0 0 70px #8a2be2,
      0 0 120px #8a2be2;
    clip-path:polygon(
      50% 0%,
      61% 36%,
      100% 50%,
      61% 64%,
      50% 100%,
      39% 64%,
      0% 50%,
      39% 36%
    );
}

@keyframes starAppear{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    35%{
        opacity:1;
    }
    70%{
        transform:translate(-50%,-50%) scale(1.5);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* =========================
   NIKKAH HEART
========================= */

#heartScene{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:scale(.7);
    pointer-events:none;
    z-index:10;
}

#heartScene.show{
    animation:heartEntrance 2s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes heartEntrance{
    0%{
        opacity:0;
        transform:scale(.45);
    }

    60%{
        opacity:1;
        transform:scale(1.06);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }
}

#heart{
    position:relative;
    width:min(88vw,520px);
    height:min(78vw,470px);
    filter:
      drop-shadow(0 0 8px #8a2be2)
      drop-shadow(0 0 28px rgba(138,43,226,.65));
}

/*
  Two circles + rotated square create the heart silhouette.
  The Nikkah words are positioned using the mathematical
  heart equation below.
*/

.nikkah{
    position:absolute;
    color:#dca8ff;
    font-size:clamp(8px,1.9vw,13px);
    font-weight:bold;
    white-space:nowrap;
    text-shadow:
      0 0 5px #a855f7,
      0 0 12px rgba(168,85,247,.8);
    transform:translate(-50%,-50%);
    opacity:0;
    animation:nikkahReveal .8s ease forwards;
}

@keyframes nikkahReveal{
    from{
        opacity:0;
        transform:translate(-50%,-50%) scale(.3);
    }
    to{
        opacity:.92;
        transform:translate(-50%,-50%) scale(1);
    }
}

.centerNikkah{
    position:absolute;
    left:50%;
    top:53%;
    transform:translate(-50%,-50%);
    font-family:Georgia,serif;
    font-size:clamp(32px,10vw,70px);
    font-weight:bold;
    color:white;
    letter-spacing:4px;
    text-shadow:
      0 0 8px white,
      0 0 25px #c084fc,
      0 0 55px #8a2be2;
    opacity:0;
}

.centerNikkah.show{
    animation:centerReveal 2s ease forwards;
}

@keyframes centerReveal{
    from{
        opacity:0;
        transform:translate(-50%,-50%) scale(.4);
    }
    to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* =========================
   MESSAGE
========================= */

#message{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    opacity:0;
    transform:scale(.75) rotate(-8deg);
    pointer-events:none;
}

#message.show{
    animation:messageEnter 2s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes messageEnter{
    0%{
        opacity:0;
        transform:scale(.55) rotate(-15deg);
    }

    60%{
        opacity:1;
        transform:scale(1.04) rotate(2deg);
    }

    100%{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

.messageBox{
    max-width:700px;
}

.small{
    color:#c084fc;
    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:22px;
}

.mainText{
    font-size:clamp(25px,7vw,48px);
    line-height:1.3;
    font-weight:bold;
    text-shadow:
      0 0 15px rgba(168,85,247,.7);
}

.highlight{
    color:#d8a4ff;
}

.subText{
    margin-top:25px;
    font-family:Arial,sans-serif;
    font-size:clamp(14px,4vw,18px);
    line-height:1.8;
    color:#d7c7df;
}

.final{
    margin-top:28px;
    font-size:clamp(17px,5vw,25px);
    color:white;
    font-weight:bold;
}

.signature{
    margin-top:22px;
    color:#c084fc;
    font-size:15px;
    letter-spacing:2px;
}

/* =========================
   FINAL HEART
========================= */

#finalHeart{
    display:inline-block;
    color:#c084fc;
    animation:pulse 1.5s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        text-shadow:0 0 10px #8a2be2;
    }
    50%{
        transform:scale(1.18);
        text-shadow:
          0 0 20px #a855f7,
          0 0 40px #8a2be2;
    }
}

/* vignette */
#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:50;
    background:radial-gradient(
      circle,
      transparent 45%,
      rgba(0,0,0,.7) 100%
    );
}

/* mobile adjustment */
@media(max-width:600px){
    #heart{
        width:94vw;
        height:80vw;
    }

    .nikkah{
        font-size:7px;
    }

    .small{
        font-size:11px;
        letter-spacing:3px;
    }
}
</style>
</head>

<body>

<div id="space"></div>

<div id="singleStar">
    <div class="starCore"></div>
</div>

<div id="heartScene">
    <div id="heart"></div>
    <div class="centerNikkah">NIKKAH</div>
</div>

<div id="message">
    <div class="messageBox">

        <div class="small">For My Sarauniya</div>

        <div class="mainText">
            If Allah wills,<br>
            one day this won't just be a
            <span class="highlight">word.</span>
        </div>

        <div class="subText">
            It will be the beginning of the life
            I pray we build together.
            <br><br>
            Through every season, every test,
            every prayer and every smile...
            I want to keep choosing you.
        </div>

        <div class="final">
            Nikkah, In Shaa Allah
            <span id="finalHeart">💜</span>
        </div>

        <div class="signature">
            Yours, always.
        </div>

    </div>
</div>

<div id="vignette"></div>

<script>

/* ==========================================
   CREATE THE STAR UNIVERSE
========================================== */

const space = document.getElementById("space");

const STAR_COUNT = 260;

for(let i = 0; i < STAR_COUNT; i++){

    const star = document.createElement("div");

    star.className = "star fly";

    const x = Math.random() * 100;
    const y = Math.random() * 100;

    star.style.left = x + "%";
    star.style.top = y + "%";

    star.style.setProperty("--x",x);
    star.style.setProperty("--y",y);

    const speed = 1.8 + Math.random() * 2.8;

    star.style.setProperty("--speed",speed + "s");

    star.style.animationDelay =
        (Math.random() * 2.8) + "s";

    const size = .7 + Math.random() * 2.1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    space.appendChild(star);
}


/* ==========================================
   HEART MATHEMATICS

   x = 16 sin³(t)

   y =
   13 cos(t)
   - 5 cos(2t)
   - 2 cos(3t)
   - cos(4t)

   This produces an actual mathematical
   heart rather than a rough shape.
========================================== */

function createNikkahHeart(){

    const heart = document.getElementById("heart");

    const width = heart.clientWidth;
    const height = heart.clientHeight;

    /*
      More words = smoother heart.
      But we avoid thousands of DOM elements
      to keep phones smooth.
    */

    const points = [];

    const rows = 38;
    const cols = 22;

    for(let i = 0; i < rows; i++){

        const t =
            Math.PI * 2 *
            (i / rows);

        /*
          Generate multiple points around
          the mathematical heart perimeter.
        */

        const x =
            16 * Math.pow(Math.sin(t),3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2*t)
            - 2 * Math.cos(3*t)
            - Math.cos(4*t);

        points.push({x,y});
    }

    /*
      Fill the heart by scanning horizontal
      layers between the two boundaries.
    */

    for(let y=-17; y<=13; y+=1.15){

        const intersections=[];

        for(let x=-18; x<=18; x+=.18){

            const inside =
                Math.pow(
                    x*x +
                    Math.pow(y - Math.sqrt(Math.abs(x)),2),
                    1
                );

            /*
              Standard implicit test based on
              the heart curve.
            */

            const f =
                Math.pow(
                    x*x + y*y - 1,
                    3
                )
                - x*x*Math.pow(y,3);

            if(f <= 0){
                intersections.push(x);
            }
        }

        if(intersections.length){

            const minX = Math.min(...intersections);
            const maxX = Math.max(...intersections);

            for(
                let x=minX;
                x<=maxX;
                x+=1.05
            ){

                const spanX = x / 18;

                const px =
                    width/2 +
                    spanX * width*.47;

                /*
                  invert vertical axis
                */

                const py =
                    height/2 -
                    (y/17) * height*.46;

                const word =
                    document.createElement("span");

                word.className="nikkah";

                word.textContent="Nikkah";

                word.style.left=px+"px";
                word.style.top=py+"px";

                /*
                  Tiny random delay creates a
                  flowing formation.
                */

                word.style.animationDelay =
                    (Math.random()*1.4)+"s";

                heart.appendChild(word);
            }
        }
    }
}


/* ==========================================
   FALLBACK / CLEANER HEART LAYER

   Creates a second precise perimeter layer
   so the silhouette stays unmistakable.
========================================== */

function createHeartOutline(){

    const heart =
        document.getElementById("heart");

    const width=heart.clientWidth;
    const height=heart.clientHeight;

    for(let i=0;i<120;i++){

        const t =
            (Math.PI*2*i)/120;

        const x =
            16*Math.pow(Math.sin(t),3);

        const y =
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t);

        const word =
            document.createElement("span");

        word.className="nikkah";

        word.textContent="Nikkah";

        word.style.left =
            width/2 +
            (x/18)*width*.48 +
            "px";

        word.style.top =
            height/2 -
            (y/17)*height*.47 +
            "px";

        word.style.animationDelay =
            (i*.012)+"s";

        heart.appendChild(word);
    }
}


/* ==========================================
   CINEMATIC TIMELINE
========================================== */

const singleStar =
    document.getElementById("singleStar");

const heartScene =
    document.getElementById("heartScene");

const centerNikkah =
    document.querySelector(".centerNikkah");

const message =
    document.getElementById("message");


/*
  First:
  stars rush forward.
*/

setTimeout(()=>{

    /*
      Hide old stars.
    */

    document
      .querySelectorAll(".star")
      .forEach(s=>{
          s.style.opacity="0";
      });

    singleStar.classList.add("show");

},5200);


/*
  One star remains,
  then becomes the Nikkah heart.
*/

setTimeout(()=>{

    singleStar.style.transition =
        "all 1.5s ease";

    singleStar.style.transform =
        "translate(-50%,-50%) scale(0)";

    singleStar.style.opacity="0";

    heartScene.classList.add("show");

    createNikkahHeart();
    createHeartOutline();

},7800);


/*
  Center NIKKAH appears.
*/

setTimeout(()=>{

    centerNikkah.classList.add("show");

},9800);


/*
  Heart holds for a moment,
  then spins away.
*/

setTimeout(()=>{

    heartScene.style.transition =
        "transform 2.2s cubic-bezier(.7,0,.2,1), opacity 1.8s ease";

    heartScene.style.transform =
        "scale(1.8) rotate(360deg)";

    heartScene.style.opacity="0";

},13200);


/*
  Final message.
*/

setTimeout(()=>{

    message.classList.add("show");

},14300);


/*
  Small final stars behind the message.
*/

setTimeout(()=>{

    for(let i=0;i<45;i++){

        const s =
            document.createElement("div");

        s.className="star";

        s.style.left =
            Math.random()*100+"%";

        s.style.top =
            Math.random()*100+"%";

        s.style.opacity =
            .3+Math.random()*.7;

        s.style.animation =
            "pulse 2s ease-in-out infinite";

        s.style.animationDelay =
            Math.random()*2+"s";

        space.appendChild(s);
    }

},14500);

</script>

</body>
</html>
