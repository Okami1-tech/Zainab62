<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKAH 💜</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030005;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

/* Background glow — NOT the heart */
body::before {
    content: "";
    position: fixed;
    width: 75vw;
    height: 75vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    background: rgba(138, 43, 226, 0.10);
    filter: blur(100px);
    pointer-events: none;
}

/* =========================================================
   THE HEART
   ========================================================= */

#heart {
    position: relative;
    width: min(94vw, 760px);
    height: min(88vh, 720px);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    transform: translateY(1%);
}

/*
Every row contains actual NIKKAH words.
The row widths below create the heart silhouette.
*/

.row {
    height: 15px;

    display: flex;
    justify-content: center;
    align-items: center;

    white-space: nowrap;

    opacity: 0;
    transform: translateY(80px) scale(.7);

    animation:
        formHeart 1.8s cubic-bezier(.16,1,.3,1) forwards;

    animation-delay: var(--delay);
}

.word {
    display: inline-block;

    margin: 0 2px;

    color: #b95cff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(7px, .95vw, 11px);

    font-weight: bold;

    letter-spacing: .03em;

    text-shadow:
        0 0 3px #8a2be2,
        0 0 7px #8a2be2,
        0 0 14px rgba(138,43,226,.75);

    opacity: .82;

    transition:
        transform .25s ease,
        color .25s ease;
}

.word:nth-child(3n) {
    color: #d18aff;
}

.word:nth-child(5n) {
    color: #a848ff;
}

.word:hover {
    transform: scale(1.3);
    color: #ffffff;
}

/* Formation */

@keyframes formHeart {

    0% {
        opacity: 0;
        transform:
            translateY(80px)
            scale(.65);
    }

    65% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   CENTER WORD
   ========================================================= */

#center {
    position: absolute;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%)
        scale(.3);

    opacity: 0;

    z-index: 20;

    pointer-events: none;

    animation:
        centerAppear 2s
        cubic-bezier(.16,1,.3,1)
        4.8s forwards;
}

#center span {
    display: block;

    color: #e1b6ff;

    font-size:
        clamp(30px, 9vw, 76px);

    font-weight: bold;

    letter-spacing: .08em;

    text-shadow:
        0 0 5px #8a2be2,
        0 0 15px #8a2be2,
        0 0 35px #8a2be2,
        0 0 70px rgba(138,43,226,.9);
}

@keyframes centerAppear {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.3);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================================================
   FINAL MESSAGE
   ========================================================= */

#message {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    color: rgba(213,170,255,.65);

    font-size: 10px;

    letter-spacing: .35em;

    text-transform: uppercase;

    white-space: nowrap;

    opacity: 0;

    animation:
        messageIn 2s ease 6s forwards;
}

@keyframes messageIn {
    to {
        opacity: 1;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    #heart {
        width: 100vw;
        height: 76vh;
    }

    .row {
        height: 11px;
    }

    .word {
        margin: 0 1.2px;
        font-size: 6.5px;
        letter-spacing: 0;
    }

    #center {
        top: 51%;
    }
}

</style>
</head>

<body>

<div id="heart"></div>

<div id="center">
    <span>NIKKAH</span>
</div>

<div id="message">
    In Shaa Allah
</div>


<script>

/*
==============================================================
NIKKAH TEXT HEART
==============================================================

The heart is constructed ROW BY ROW.

Each row contains actual text:

NIKKAH NIKKAH NIKKAH NIKKAH ...

The widths are deliberately controlled to create:

             NIKKAH       NIKKAH
          NIKKAH NIKKAH NIKKAH NIKKAH
       NIKKAH NIKKAH NIKKAH NIKKAH NIKKAH
      NIKKAH NIKKAH NIKKAH NIKKAH NIKKAH
       NIKKAH NIKKAH NIKKAH NIKKAH NIKKAH
         NIKKAH NIKKAH NIKKAH NIKKAH
            NIKKAH NIKKAH NIKKAH
                NIKKAH
                  NIKKAH

==============================================================
*/


const heart = document.getElementById("heart");


/*
Each number represents how many NIKKAH words
should appear on that row.

The important part is the SHAPE.

The first rows intentionally have a gap in the middle.
That creates the deep heart indentation.
*/

const rows = [

    /* TOP INDENTATION + TWO LOBES */

    { count: 18, gap: true },
    { count: 28, gap: true },
    { count: 40, gap: true },
    { count: 48, gap: true },

    { count: 54, gap: true },
    { count: 58, gap: true },

    /* LOBES JOIN */

    { count: 64, gap: false },
    { count: 68, gap: false },
    { count: 72, gap: false },

    { count: 74, gap: false },
    { count: 76, gap: false },

    /* WIDEST PART */

    { count: 78, gap: false },
    { count: 78, gap: false },
    { count: 77, gap: false },
    { count: 75, gap: false },

    /* START NARROWING */

    { count: 72, gap: false },
    { count: 69, gap: false },
    { count: 66, gap: false },
    { count: 62, gap: false },
    { count: 58, gap: false },
    { count: 54, gap: false },
    { count: 50, gap: false },
    { count: 46, gap: false },
    { count: 42, gap: false },
    { count: 38, gap: false },
    { count: 34, gap: false },
    { count: 30, gap: false },
    { count: 26, gap: false },
    { count: 22, gap: false },
    { count: 18, gap: false },
    { count: 14, gap: false },
    { count: 10, gap: false },
    { count: 7, gap: false },
    { count: 4, gap: false },
    { count: 2, gap: false },
    { count: 1, gap: false }
];


/*
Create one row.
*/

rows.forEach((data, rowIndex) => {

    const row = document.createElement("div");

    row.className = "row";

    /*
    Rows appear progressively rather than all at once.
    */

    row.style.setProperty(
        "--delay",
        `${rowIndex * 0.055}s`
    );


    /*
    ==========================================================
    TOP HEART INDENTATION
    ==========================================================

    Instead of putting a heart image behind the text,
    we simply don't put words in the middle of the first
    rows.

    That empty space becomes the actual heart valley.
    */

    if (data.gap) {

        const half =
            Math.floor(data.count / 2);

        /*
        Left lobe
        */

        for (let i = 0; i < half; i++) {

            createWord(row);
        }


        /*
        The middle is intentionally EMPTY.

        The width of this empty area decreases as we go down,
        causing the two lobes to curve toward each other.
        */

        const spacer =
            document.createElement("span");

        spacer.style.width =
            `${Math.max(
                15,
                75 - rowIndex * 8
            )}px`;

        row.appendChild(spacer);


        /*
        Right lobe
        */

        for (let i = 0; i < half; i++) {

            createWord(row);
        }

    } else {

        /*
        Normal full-width rows.
        */

        for (let i = 0; i < data.count; i++) {

            createWord(row);
        }
    }

    heart.appendChild(row);
});


/*
==============================================================
CREATE NIKKAH
==============================================================
*/

function createWord(row) {

    const word =
        document.createElement("span");

    word.className = "word";

    word.textContent = "NIKKAH";

    row.appendChild(word);
}


/*
==============================================================
RESTART ON TAP
==============================================================
*/

document.body.addEventListener("click", () => {

    const allRows =
        document.querySelectorAll(".row");

    allRows.forEach((row, i) => {

        row.style.animation = "none";

        /*
        Force browser reflow.
        */

        void row.offsetWidth;

        row.style.animation =
            `formHeart 1.8s cubic-bezier(.16,1,.3,1)
             ${i * 0.055}s forwards`;
    });

});

</script>

</body>
</html>
