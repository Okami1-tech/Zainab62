<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>NIKKAH — In Shaa Allah</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020003;
}

body{
    position:relative;
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================================================
   PURPLE ATMOSPHERE
========================================================= */

.backgroundGlow{
    position:fixed;
    width:90vmin;
    height:90vmin;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(138,43,226,.15),
            rgba(91,20,150,.06) 38%,
            transparent 72%
        );

    filter:blur(35px);
    pointer-events:none;
}

/* =========================================================
   HEART
========================================================= */

#heart{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(96vw,900px);
    height:min(94vh,900px);

    pointer-events:none;
}


/* Each NIKKAH */

.word{
    position:absolute;

    color:#b75cff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight:bold;

    white-space:nowrap;

    line-height:1;

    text-shadow:
        0 0 3px rgba(138,43,226,.95),
        0 0 7px rgba(138,43,226,.8),
        0 0 14px rgba(138,43,226,.55);

    opacity:0;

    animation:
        appear 2.2s
        cubic-bezier(.16,1,.3,1)
        forwards;

    animation-delay:var(--delay);
}


/* subtle color variation */

.word:nth-child(5n){
    color:#ca7cff;
}

.word:nth-child(9n){
    color:#963cff;
}

.word:nth-child(13n){
    color:#dfabff;
}


@keyframes appear{

    0%{
        opacity:0;

        transform:
            translate(
                var(--startX),
                var(--startY)
            )
            scale(.35);
    }

    60%{
        opacity:.65;
    }

    100%{
        opacity:var(--finalOpacity);

        transform:
            translate(0,0)
            scale(1);
    }
}


/* =========================================================
   CENTER REVEAL
========================================================= */

#reveal{
    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.25);

    opacity:0;

    text-align:center;

    z-index:20;

    pointer-events:none;

    animation:
        reveal
        2.4s
        cubic-bezier(.16,1,.3,1)
        7.4s
        forwards;
}

#mainWord{

    color:#e2b5ff;

    font-size:
        clamp(42px,11vw,105px);

    font-weight:bold;

    letter-spacing:.08em;

    text-shadow:

        0 0 5px #8a2be2,
        0 0 15px #8a2be2,
        0 0 30px #8a2be2,
        0 0 55px #8a2be2,
        0 0 100px rgba(138,43,226,.8);

    animation:
        pulse
        3s
        ease-in-out
        infinite;
}


#subWord{

    margin-top:10px;

    color:#d8a5ff;

    font-size:
        clamp(11px,3vw,18px);

    letter-spacing:.28em;

    text-shadow:
        0 0 8px #8a2be2,
        0 0 20px rgba(138,43,226,.65);

    opacity:0;

    animation:
        subReveal
        1.8s
        ease
        8.5s
        forwards;
}


@keyframes reveal{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.25);
    }

    65%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.08);
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


@keyframes pulse{

    0%,100%{
        filter:brightness(.9);
    }

    50%{
        filter:brightness(1.3);
    }
}


@keyframes subReveal{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   BOTTOM
========================================================= */

#hint{

    position:fixed;

    bottom:22px;
    left:50%;

    transform:translateX(-50%);

    color:rgba(207,159,255,.4);

    font-size:9px;

    letter-spacing:.32em;

    text-transform:uppercase;

    white-space:nowrap;

    opacity:0;

    animation:
        hint
        2s
        ease
        10s
        forwards;
}

@keyframes hint{
    to{opacity:1;}
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #heart{
        width:110vw;
        height:94vh;
    }

    #mainWord{
        font-size:clamp(38px,14vw,70px);
    }

    #subWord{
        font-size:10px;
        letter-spacing:.22em;
    }
}
</style>
</head>

<body>

<div class="backgroundGlow"></div>

<div id="heart"></div>


<div id="reveal">

    <div id="mainWord">
        NIKKAH
    </div>

    <div id="subWord">
        In Shaa Allah
    </div>

</div>


<div id="hint">
    A beautiful beginning
</div>


<script>

/* =========================================================
   REAL HEART TEXT ENGINE
========================================================= */

const heart =
    document.getElementById("heart");


/*
   IMPORTANT:

   We are NOT drawing a heart.

   We calculate thousands of positions INSIDE a tall
   heart silhouette and put the actual word NIKKAH
   at those positions.

   So the text itself is the heart.
*/


const W = window.innerWidth;
const H = window.innerHeight;


/* =========================================================
   HEART SIZE

   Tall instead of short.
========================================================= */

const heartW =
    Math.min(W * .91, 780);

const heartH =
    Math.min(H * .91, 820);

const centerX =
    heartW / 2;

const centerY =
    heartH / 2;


/* =========================================================
   HEART MASK

   This is a controlled heart silhouette.

   We use a parametric heart outline and fill the inside
   with rows of NIKKAH words.

   The formula:

   x = 16 sin³(t)

   y = 13 cos(t)
       - 5 cos(2t)
       - 2 cos(3t)
       - cos(4t)

   is only being used to determine the silhouette.
   There is NO SVG and NO heart graphic.
========================================================= */


function heartPoint(t){

    const x =
        16 *
        Math.pow(Math.sin(t),3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t);

    return {x,y};
}


/* =========================================================
   CREATE A DENSE HEART MASK

   We sample the mathematical heart into a 2D occupancy
   field, then put NIKKAH text inside the actual filled area.

   The final shape is intentionally stretched vertically.
========================================================= */


const sampleSize = 520;

const mask =
    new Uint8Array(
        sampleSize * sampleSize
    );


/*
   Draw/fill the silhouette mathematically into a mask.

   For each pixel we check whether it lies inside the
   heart boundary by using the normalized heart equation.
*/


function insideHeart(nx,ny){

    /*
       Convert normalized screen position
       into the classic heart coordinate system.
    */

    const x = nx * 16;
    const y = -ny * 16;


    /*
       Classic implicit heart:

       (x²+y²-1)³ - x²y³ <= 0
    */

    const a =
        x*x + y*y - 1;

    const value =
        a*a*a
        - x*x*y*y*y;

    return value <= 0;
}


/*
   Fill mask.
*/

for(let py=0; py<sampleSize; py++){

    const ny =
        (py/(sampleSize-1))*2 - 1;

    for(let px=0; px<sampleSize; px++){

        const nx =
            (px/(sampleSize-1))*2 - 1;

        if(
            insideHeart(nx,ny)
        ){

            mask[
                py*sampleSize+px
            ] = 1;
        }
    }
}


/* =========================================================
   FIND WHETHER A POSITION IS INSIDE THE HEART
========================================================= */

function isInside(x,y){

    const px =
        Math.floor(
            (x+1)/2*(sampleSize-1)
        );

    const py =
        Math.floor(
            (y+1)/2*(sampleSize-1)
        );

    if(
        px<0 ||
        py<0 ||
        px>=sampleSize ||
        py>=sampleSize
    ){
        return false;
    }

    return (
        mask[
            py*sampleSize+px
        ] === 1
    );
}


/* =========================================================
   TEXT SPACING
========================================================= */

const fontSize =
    Math.max(
        6,
        Math.min(
            10,
            heartW*.012
        )
    );


/*
   Horizontal distance between words.

   Very dense.
*/

const spacingX =
    fontSize * .88;


/*
   Vertical distance.

   Smaller than the word height so the heart becomes
   a solid wall of NIKKAH.
*/

const spacingY =
    fontSize * .82;


/* =========================================================
   CREATE THE ACTUAL TEXT HEART
========================================================= */

let count = 0;

const totalRows =
    Math.floor(
        heartH / spacingY
    );


for(
    let row=0;
    row<totalRows;
    row++
){

    /*
       normalized Y.

       Top = -1
       Bottom = +1
    */

    const ny =
        -1 +
        (row/(totalRows-1))*2;


    /*
       Convert normalized position to actual screen
       coordinates inside #heart.
    */

    const y =
        centerY +
        ny *
        heartH *
        .48;


    /*
       Horizontal scan.

       The heart is checked point-by-point.

       This produces the actual rounded lobes,
       indentation and long point.
    */

    for(
        let x=-1;
        x<=1;
        x += spacingX/heartW
    ){

        if(
            !isInside(x,ny)
        ){
            continue;
        }


        /*
           Don't overcrowd the exact outer boundary.

           But keep enough words there so the contour
           remains clearly visible.
        */

        const edgeCheck =
            isInside(
                x + .018,
                ny
            ) &&
            isInside(
                x - .018,
                ny
            );


        /*
           Actual position.
        */

        const px =
            centerX +
            x *
            heartW *
            .48;


        const py =
            y;


        /*
           Every word is a real HTML text element.
        */

        const word =
            document.createElement("span");

        word.className =
            "word";

        word.textContent =
            "NIKKAH";


        /*
           Position.
        */

        word.style.left =
            `${px}px`;

        word.style.top =
            `${py}px`;


        /*
           Center the word around its coordinate.
        */

        word.style.transform =
            "translate(-50%,-50%)";


        /*
           Slight random opacity.
        */

        const opacity =
            edgeCheck
                ? .75 + Math.random()*.2
                : .55 + Math.random()*.4;

        word.style.setProperty(
            "--finalOpacity",
            opacity
        );


        /*
           Different starting directions.

           This makes the words appear from scattered
           positions and settle into the heart.
        */

        const startX =
            (Math.random()-.5) *
            W *
            .8;

        const startY =
            (Math.random()-.5) *
            H *
            .8;


        word.style.setProperty(
            "--startX",
            `${startX}px`
        );

        word.style.setProperty(
            "--startY",
            `${startY}px`
        );


        /*
           Progressive formation.

           Top begins first, then the rest follows.
        */

        word.style.setProperty(
            "--delay",
            `${row*.045 + Math.random()*.25}s`
        );


        /*
           Slight size variation.
        */

        const size =
            fontSize *
            (.78 + Math.random()*.28);

        word.style.fontSize =
            `${size}px`;


        heart.appendChild(word);

        count++;
    }
}


/* =========================================================
   CLICK = REBUILD
========================================================= */

document.body.addEventListener(
    "click",
    () => {

        const words =
            document.querySelectorAll(".word");

        words.forEach(
            (word,index)=>{

                word.style.animation =
                    "none";

                void word.offsetWidth;

                word.style.animation =
                    `appear 2.2s cubic-bezier(.16,1,.3,1)
                     ${index*.003}s forwards`;
            }
        );

    }
);

</script>

</body>
</html>
